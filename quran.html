
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قرآن مجید | Indian Travel Agency</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Naskh Arabic",sans-serif;
  background:#f5f1e7;
  color:#222;
}

header{
  background:#073d2e;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#e4bd55;
  font-size:18px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

select{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:2px solid #073d2e;
  font-size:17px;
  margin-bottom:20px;
  background:white;
}

.bismillah{
  text-align:center;
  font-family:"Noto Naskh Arabic",serif;
  font-size:32px;
  color:#073d2e;
  margin:20px 0 30px;
  line-height:2;
}

.surah-title{
  text-align:center;
  color:#b88a0a;
  font-size:30px;
  font-weight:bold;
  margin-bottom:25px;
}

.ayah{
  background:#fff;
  border:1px solid #eee;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  line-height:2.4;
  font-family:"Noto Naskh Arabic",serif;
  font-size:27px;
  text-align:right;
  direction:rtl;
}

.ayah-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#087653;
  color:white;
  font-family:Arial,sans-serif;
  font-size:16px;
  margin-left:10px;
  vertical-align:middle;
}

.home-btn{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#073d2e;
  color:white;
  padding:17px;
  border-radius:15px;
  font-size:20px;
  font-weight:bold;
  margin-top:25px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#073d2e;
  font-size:20px;
}

.error{
  text-align:center;
  padding:25px;
  color:#b00020;
  font-size:18px;
}

@media(max-width:600px){

  header h1{
    font-size:25px;
  }

  .card{
    padding:15px;
  }

  .bismillah{
    font-size:25px;
  }

  .surah-title{
    font-size:25px;
  }

  .ayah{
    font-size:24px;
    padding:17px;
    line-height:2.3;
  }

  .ayah-number{
    width:34px;
    height:34px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 قرآن مجید</h1>
  <p>Indian Travel Agency</p>
</header>

<div class="container">

<div class="card">

<select id="surahSelect">
  <option value="">سورت منتخب کریں</option>
</select>

<div id="quran">
  <div class="loading">قرآن مجید لوڈ ہو رہا ہے۔۔۔</div>
</div>

<a class="home-btn" href="./index.html">
  🏠 واپس Home
</a>

</div>
</div>

<script>

const API = "https://api.alquran.cloud/v1";

const surahSelect = document.getElementById("surahSelect");
const quran = document.getElementById("quran");

/* 114 سورتوں کی فہرست */
const surahs = [
"الفاتحہ","البقرۃ","آل عمران","النساء","المائدۃ","الانعام","الاعراف",
"الانفال","التوبۃ","یونس","ہود","یوسف","الرعد","ابراہیم","الحجر",
"النحل","الاسراء","الکہف","مریم","طٰہٰ","الانبیاء","الحج","المؤمنون",
"النور","الفرقان","الشعراء","النمل","القصص","العنکبوت","الروم",
"لقمان","السجدۃ","الاحزاب","سبا","فاطر","یٰسین","الصافات","ص",
"الزمر","غافر","فصلت","الشوریٰ","الزخرف","الدخان","الجاثیۃ","الاحقاف",
"محمد","الفتح","الحجرات","ق","الذاریات","الطور","النجم","القمر",
"الرحمن","الواقعۃ","الحدید","المجادلۃ","الحشر","الممتحنۃ","الصف",
"الجمعۃ","المنافقون","التغابن","الطلاق","التحریم","الملک","القلم",
"الحاقۃ","المعارج","نوح","الجن","المزمل","المدثر","القیامۃ","الانسان",
"المرسلات","النبأ","النازعات","عبس","التکویر","الانفطار","المطففین",
"الانشقاق","البروج","الطارق","الاعلیٰ","الغاشیۃ","الفجر","البلد",
"الشمس","اللیل","الضحیٰ","الشرح","التین","العلق","القدر","البینۃ",
"الزلزال","العادیات","القارعۃ","التکاثر","العصر","الہمزۃ","الفیل",
"قریش","الماعون","الکوثر","الکافرون","النصر","المسد","الاخلاص",
"الفلق","الناس"
];

/* سورتوں کو Dropdown میں شامل کریں */
surahs.forEach((name,index)=>{
  const option=document.createElement("option");
  option.value=index+1;
  option.textContent=(index+1)+" — "+name;
  surahSelect.appendChild(option);
});

/* سورت لوڈ کرنے کا فنکشن */
async function loadSurah(number){

  if(!number) return;

  quran.innerHTML =
    '<div class="loading">📖 سورت لوڈ ہو رہی ہے۔۔۔</div>';

  try{

    const response =
      await fetch(API + "/surah/" + number + "/quran-uthmani");

    const data = await response.json();

    if(data.code !== 200){
      throw new Error("Quran API Error");
    }

    const surah = data.data;

    let html = "";

    html +=
      '<div class="surah-title">سورۃ '+surah.name+'</div>';

    /*
      بسم اللہ کا اصول:

      ہر سورت میں بسم اللہ ایک مرتبہ
      لیکن سورۃ التوبہ (نمبر 9) میں نہیں۔

      API کے پہلے آیت میں اگر بسم اللہ موجود ہو
      تو اسے دوبارہ شامل نہیں کیا جائے گا۔
    */

    if(number != 9){

      html += `
        <div class="bismillah">
          بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ
        </div>
      `;

    }

    surah.ayahs.forEach((ayah,index)=>{

      let text = ayah.text;

      /*
        صرف پہلی آیت کے شروع سے
        بسم اللہ کو ہٹائیں تاکہ
        اوپر صرف ایک مرتبہ دکھائی دے۔
      */

      if(index === 0 && number != 9){

        text = text.replace(
          /^بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\s*/u,
          ""
        );

        text = text.replace(
          /^بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\s*/u,
          ""
        );

      }

      html += `
        <div class="ayah">
          <span class="ayah-number">
            ${ayah.numberInSurah}
          </span>
          ${text}
        </div>
      `;

    });

    quran.innerHTML = html;

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    console.error(error);

    quran.innerHTML = `
      <div class="error">
        قرآن لوڈ نہیں ہو سکا۔<br>
        براہِ کرم انٹرنیٹ کنکشن چیک کریں۔
      </div>
    `;

  }

}

/* سورت منتخب ہونے پر */
surahSelect.addEventListener("change",function(){

  loadSurah(this.value);

});

/* شروع میں سورۃ الفاتحہ */
surahSelect.value = "1";
loadSurah(1);

</script>

</body>
</html>
